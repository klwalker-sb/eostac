[metadata]
name = eostac
description-file = README.md
url = https://github.com/jgrss/eostac
license = LICENSE.txt
version = attr: eostac.__version__
classifiers =
    Intended Audience :: Science/Research
    Topic :: Scientific :: Remote Sensing

[options]
package_dir=
    =src
packages=find:
include_package_data = True
python_requires = >=3.8
install_requires =
    geowombat[stac,web]@git+https://github.com/jgrss/geowombat.git@v2.1.3
    threadpoolctl>=3.1.0
    seaborn
    wrapt_timeout_decorator>=1.3.12

[options.entry_points]
console_scripts =
    eostac = eostac.scripts.stac_cli:main

[options.packages.find]
where=src

[options.package_data]
* = *.md, *.txt
