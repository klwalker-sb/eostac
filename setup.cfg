[metadata]
name = eostac
description-file = README.md
url = https://github.com/jgrss/eostac
license = LICENSE.txt
version = attr: eostac.__version__
classifiers =
    Intended Audience :: Science/Research
    Topic :: Scientific :: Remote Sensing

[options]
package_dir=
    =src
packages=find:
include_package_data = True
install_requires =
    geowombat@git+https://github.com/jgrss/geowombat
    geosample@git+https://github.com/jgrss/geosample
    seaborn;python_version>='3.8.12'

[options.entry_points]
console_scripts =
    eostac = eostac.scripts.stac_cli:main

[options.packages.find]
where=src

[options.package_data]
* = *.md, *.txt
